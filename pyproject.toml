[project]
name = "legal-doc-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.160.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle basics, I: import sorting, B: common bug patterns, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
